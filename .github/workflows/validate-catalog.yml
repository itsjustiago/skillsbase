name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate catalog
        run: node scripts/build-catalog.mjs

      - name: Fail on stale catalog
        run: git diff --exit-code catalog.json

      - name: Validate catalog schema
        run: node scripts/validate-catalog.mjs
